name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (Astro)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Install Playwright OS dependencies
        run: pnpm pw:install-deps

      - name: Install Playwright browsers
        run: pnpm pw:install

      - name: a11y tests
        run: pnpm test:a11y
